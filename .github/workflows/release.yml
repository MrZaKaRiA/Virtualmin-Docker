name: Test, build and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # Runs on every push, pull request and tag. Uses the WebminCore stub in
  # tests/stub so the module can be compiled and the foreign_require() hook
  # loading exercised without a Webmin install on the runner.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Run test-suite
        run: make test

  # Only builds/publishes for tags and manual dispatch, and only once the
  # tests have passed.
  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate Perl syntax
        run: make syntax

      - name: Build .wbm.gz package
        run: make package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker.wbm.gz
          path: docker.wbm.gz

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          files: docker.wbm.gz
          generate_release_notes: true
